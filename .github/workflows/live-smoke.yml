name: Live Smoke

# Real-browser checks against the deployed testnet: CORS, CSP and security
# headers, the DEX market list and a live order book, scanner data and SEO
# routes, admin login. Node-level suites cannot see browser-only failures.
on:
  workflow_run:
    workflows: [Deploy Exchange, Deploy Scanner, Deploy Admin Dashboard]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      exchange_url:
        description: 'Exchange URL to test (e.g. a Cloudflare preview); default = live testnet'
        required: false
        default: ''

concurrency:
  group: live-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Browser smoke (testnet)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install the e2e workspace only
        run: pnpm install --frozen-lockfile --filter e2e

      - name: Install Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run live smoke
        env:
          CI: 'true'
          LIVE_EXCHANGE_URL: ${{ inputs.exchange_url }}
        run: |
          set -euo pipefail
          if [[ -z "${LIVE_EXCHANGE_URL}" ]]; then unset LIVE_EXCHANGE_URL; fi
          pnpm --filter e2e exec playwright test -c playwright.live.config.ts

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-smoke-report
          path: e2e/playwright-report-live/
          retention-days: 14
