name: Crypto Run Tests

on:
  push:
    branches: [main, dev, master]
    paths:
      - 'packages/jvm/crypto/**'
      - '.github/workflows/crypto-tests.yml'
  pull_request:
    branches: [main, dev, master]
    paths:
      - 'packages/jvm/crypto/**'
      - '.github/workflows/crypto-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  run_tests:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: packages/jvm/crypto
        run: mvn -B verify -Dmaven.test.failure.ignore=true

      - name: Publish Surefire report
        if: always()
        uses: scacap/action-surefire-report@c38a2d74b9840ae8950a4387ae02b637421d0f39  # v1.13.0
        with:
          check_name: Test Report
          fail_if_no_tests: false
          report_paths: packages/jvm/crypto/**/surefire-reports/TEST-*.xml
