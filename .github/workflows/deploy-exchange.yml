name: Deploy Exchange

on:
  # Tag-based release trigger: deploy fires only when you explicitly push a
  # versioned tag — never on branch merges. Ship when you're ready.
  # Usage: git tag exchange/v1.2.3 && git push origin exchange/v1.2.3
  push:
    tags:
      - 'exchange/v*.*.*'

  # Manual trigger: build and deploy any network on demand.
  # Use this for staging/testnet releases and production hotfixes.
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy'
        required: true
        default: 'mainnet'
        type: choice
        options:
          - mainnet
          - stagenet
          - testnet

concurrency:
  # One deploy per network at a time. New runs queue behind in-flight deploys
  # for the same network rather than cancelling them.
  group: deploy-exchange-${{ github.event_name == 'workflow_dispatch' && inputs.network || 'mainnet' }}
  # Never cancel an in-flight deploy — Cloudflare Pages deploys are atomic but
  # interrupting mid-upload leaves an inconsistent deployment slot.
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write  # Required for Cloudflare Pages deployment status in PRs

jobs:
  # ── Resolve build parameters ─────────────────────────────────────────────────
  # Centralise the push/dispatch → (network, build_mode, cf_project) mapping so
  # downstream jobs can reference typed outputs rather than repeating logic.
  resolve:
    name: Resolve build parameters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      network:    ${{ steps.params.outputs.network }}
      build_mode: ${{ steps.params.outputs.build_mode }}
      cf_project: ${{ steps.params.outputs.cf_project }}

    steps:
      - name: Compute network, build mode, and CF project name
        id: params
        env:
          INPUT_NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NETWORK="${INPUT_NETWORK}"
          else
            NETWORK="mainnet"
          fi

          case "$NETWORK" in
            mainnet)
              BUILD_MODE="production"
              CF_PROJECT="dcc-exchange-mainnet"
              ;;
            stagenet)
              BUILD_MODE="staging"
              CF_PROJECT="dcc-exchange-stagenet"
              ;;
            testnet)
              BUILD_MODE="testnet"
              CF_PROJECT="exchange-testnet"
              ;;
            *)
              echo "::error::Unknown network: $NETWORK"
              exit 1
              ;;
          esac

          echo "network=$NETWORK"        >> "$GITHUB_OUTPUT"
          echo "build_mode=$BUILD_MODE"  >> "$GITHUB_OUTPUT"
          echo "cf_project=$CF_PROJECT"  >> "$GITHUB_OUTPUT"

          echo "### Build parameters" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter  | Value |"  >> "$GITHUB_STEP_SUMMARY"
          echo "|------------|-------|"  >> "$GITHUB_STEP_SUMMARY"
          echo "| Network    | \`$NETWORK\` |"    >> "$GITHUB_STEP_SUMMARY"
          echo "| BuildMode  | \`$BUILD_MODE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CF Project | \`$CF_PROJECT\` |" >> "$GITHUB_STEP_SUMMARY"

  # ── Build static assets ───────────────────────────────────────────────────────
  # The exchange is a React SPA (Vite). We build it here in GHA and upload
  # the dist/ directory directly to Cloudflare Pages — no Docker involved.
  # Each network maps to a separate CF Pages project, so network selection is
  # baked in at build time via the Vite --mode flag, exactly as before.
  #
  # Prerequisite: 3 CF Pages projects must exist before first deploy:
  #   npx wrangler@4.99.0 pages project create dcc-exchange-mainnet --production-branch main
  #   npx wrangler@4.99.0 pages project create dcc-exchange-stagenet --production-branch main
  #   npx wrangler@4.99.0 pages project create dcc-exchange-testnet --production-branch main
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build and deploy (${{ needs.resolve.outputs.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve
    # Only auto-deploy mainnet; stagenet and testnet require manual dispatch.
    if: >-
      needs.resolve.outputs.network == 'mainnet' ||
      github.event_name == 'workflow_dispatch'

    environment:
      name: ${{ needs.resolve.outputs.network }}
      url: ${{ needs.resolve.outputs.network == 'mainnet' && 'https://decentral.exchange' || format('https://{0}.decentral.exchange', needs.resolve.outputs.network) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── Node + pnpm (canonical DCC pattern) ───────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version-file: .node-version

      # ── Rust / WASM toolchain (required by packages/sdk/crypto wasm-pack build) ──
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/sdk/crypto
          cache-on-failure: true

      - name: Install wasm-pack v0.15.0
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/wasm-pack.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  /tmp/wasm-pack.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          mv /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build SDK packages ────────────────────────────────────────────────
      # Workspace packages must be compiled before the exchange can import them.
      - name: Build SDK packages
        run: pnpm --filter './packages/**' run build

      # ── Test the exchange ─────────────────────────────────────────────────
      # Run the full test suite with coverage before building. This gates manual
      # deploys (workflow_dispatch) the same way CI gates PR merges — no broken
      # code can reach any environment, including testnet.
      - name: Test exchange
        run: pnpm nx run exchange:test

      # ── Build the exchange ────────────────────────────────────────────────
      # tsc -b validates TypeScript project references; vite build produces
      # apps/exchange/dist/ with the network baked in via .env.<mode>.
      - name: Build exchange (${{ needs.resolve.outputs.build_mode }})
        env:
          # SENTRY_AUTH_TOKEN: @sentry/vite-plugin uses this to upload source maps
          # and create the release in Sentry. The plugin no-ops when absent.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # SENTRY_RELEASE: tag name on tag pushes (e.g. exchange/v1.2.3), or the
          # short commit SHA on workflow_dispatch. Sentry rejects branch names like
          # "main" as release identifiers — always use a version string or SHA.
          SENTRY_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          pnpm --filter ./apps/exchange exec tsc -b
          pnpm --filter ./apps/exchange exec vite build --mode "${{ needs.resolve.outputs.build_mode }}"

      - name: Verify dist/ was produced
        run: |
          set -euo pipefail
          if [[ ! -d apps/exchange/dist ]]; then
            echo "::error::apps/exchange/dist/ not found — vite build failed"
            exit 1
          fi
          echo "dist/ size: $(du -sh apps/exchange/dist | cut -f1)"

      # ── Deploy to Cloudflare Pages ────────────────────────────────────────
      # Required secrets (org-level or this repo's environment):
      #   CLOUDFLARE_API_TOKEN   — CF API token with Pages:Edit permission
      #   CLOUDFLARE_ACCOUNT_ID  — CF account ID
      #
      # gitHubToken enables Cloudflare to post deployment status to PRs.
      # wranglerVersion pins the CLI used inside the action.
      - name: Check Cloudflare secrets
        id: cf-check
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — deploy skipped (infra pending)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-install Wrangler (pnpm 11 requires -w flag for workspace-root installs)
        if: steps.cf-check.outputs.configured == 'true'
        run: pnpm add -w wrangler@4.99.0

      # Ensure the CF Pages project's production_branch is 'main' before deploying.
      # When this drifts (e.g. after Cloudflare UI edits or project recreation),
      # wrangler --branch=main creates a preview rather than updating the production
      # alias, leaving testnet.decentral.exchange serving a stale deployment.
      - name: Pin production branch to main
        if: steps.cf-check.outputs.configured == 'true'
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ needs.resolve.outputs.cf_project }}
        run: |
          set -euo pipefail
          RESP=$(curl -sf -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PROJECT}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}')
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('production_branch:', d['result'].get('production_branch','unknown'))"
          # A connected git integration (GitHub/GitLab) auto-deploys on every push to
          # production_branch independently of this workflow's wrangler upload, racing
          # it and sometimes publishing a build whose HTML/asset hashes don't match
          # (stale-HTML-vs-missing-assets 404s, confirmed live on this project). The
          # wrangler deploy below is meant to be the ONLY production publisher, so
          # disable the git source's production deployments (idempotent — safe to
          # run every deploy in case someone re-enables it via the CF dashboard).
          DISABLE_BODY=$(echo "$RESP" | python3 -c "import sys, json; d = json.load(sys.stdin)['result']; src = d.get('source'); cfg = dict(src.get('config') or {}); cfg['production_deployments_enabled'] = False; print(json.dumps({'source': {'type': src.get('type'), 'config': cfg}})) if src else print('')")
          if [[ -n "$DISABLE_BODY" ]]; then
            RESP2=$(curl -sf -X PATCH \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PROJECT}" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$DISABLE_BODY")
            echo "$RESP2" | python3 -c "import sys, json; d = json.load(sys.stdin)['result']; src = d.get('source') or {}; print('git source production_deployments_enabled:', (src.get('config') or {}).get('production_deployments_enabled', 'unknown'))"
          else
            echo "No connected git source (source is null) — wrangler deploy is the sole publisher."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf-check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken:       ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:      ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken:    ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.99.0'
          command: >-
            pages deploy apps/exchange/dist
            --project-name=${{ needs.resolve.outputs.cf_project }}
            --commit-hash=${{ github.sha }}
            --branch=main

      # Verify the production URL returns 200 after deploy.
      # Cloudflare Pages production alias can drift between deploys; catching
      # it here means we know immediately rather than from a user report.
      # Re-PATCH and retry once if the first check fails.
      - name: Verify production URL
        if: needs.resolve.outputs.network == 'testnet'
        env:
          CF_TOKEN:   ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ needs.resolve.outputs.cf_project }}
        run: |
          set -euo pipefail
          URL="https://testnet.decentral.exchange/"
          echo "Checking $URL ..."

          # Bust any edge cache so we check what's actually live, not a stale
          # cached copy of the HTML from before this deploy.
          check_page() {
            HTML=$(curl -s --max-time 15 -H "Cache-Control: no-cache" "$URL?cachebust=$(date +%s)")
            STATUS=$(curl -so /dev/null -w "%{http_code}" --max-time 15 -H "Cache-Control: no-cache" "$URL?cachebust=$(date +%s)")
            echo "HTTP $STATUS"
            [[ "$STATUS" == "200" ]] || return 1

            # The HTML loading with 200 isn't enough — Cloudflare Pages can serve
            # stale cached HTML that references a JS/CSS bundle from a previous,
            # already-garbage-collected build, so every asset the page needs 404s
            # and the site is a blank page despite this check passing. Fetch the
            # first referenced hashed asset and confirm it actually resolves.
            ASSET=$(echo "$HTML" | grep -oE '/assets/[A-Za-z0-9_.-]+\.(js|css)' | head -1)
            if [[ -z "$ASSET" ]]; then
              echo "::warning::Could not find a referenced asset path in the HTML to verify"
              return 0
            fi
            ASSET_STATUS=$(curl -so /dev/null -w "%{http_code}" --max-time 15 "https://testnet.decentral.exchange${ASSET}")
            echo "Referenced asset $ASSET -> HTTP $ASSET_STATUS"
            [[ "$ASSET_STATUS" == "200" ]]
          }

          if check_page; then
            echo "Production URL is healthy."
            exit 0
          fi

          echo "::warning::Production URL check failed — re-pinning production_branch and retrying..."
          curl -sf -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${CF_PROJECT}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}' > /dev/null

          sleep 10
          if ! check_page; then
            echo "::error::Production URL still unhealthy after re-pin. Manual intervention required (check for a connected CF Pages git integration racing this deploy)."
            exit 1
          fi
          echo "Production URL recovered."

      - name: Write deploy summary
        run: |
          set -euo pipefail
          echo "### Exchange deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field   | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Network | \`${{ needs.resolve.outputs.network }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Project | \`${{ needs.resolve.outputs.cf_project }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit  | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
