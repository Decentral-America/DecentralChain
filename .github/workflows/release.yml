name: Release

# Step 2 of 2. Step 1 (versioning, changelogs, tags) runs locally via
# `node tools/release/version.mjs` because main is branch-protected. This workflow
# publishes every packages/sdk/* version that is on main but not yet on npm, then
# proves it: the job fails unless every version is on the registry, is `latest`,
# installs and imports. Already-published versions are skipped by nx, so a re-run
# is safe.
#
# History: the 2026-06-23 run executed `nx release` in first-release mode without --yes;
# on a non-TTY runner the publish confirmation prompt was cancelled, nx printed
# "Skipped publishing packages." and exited 0, so a green run published nothing.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        default: true
        description: Dry run (npm publish --dry-run). Untick to publish for real.
        type: boolean

concurrency:
  cancel-in-progress: false
  group: release

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm-release
    env:
      # Release workflow runs without NX Cloud access — disable cloud features
      # so nx tasks run locally instead of failing on unauthorized workspace.
      NX_NO_CLOUD: true

    steps:
      - name: Guard — enforce main branch
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "::error::Release workflow triggered from '${{ github.ref }}'. Only 'refs/heads/main' is allowed."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust / WASM toolchain (required by packages/sdk/crypto wasm-pack build) ──
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/sdk/crypto
          cache-on-failure: true

      - name: Install wasm-pack v0.15.0
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/wasm-pack.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  /tmp/wasm-pack.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          mv /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Verify npm credentials
        # Fails fast (before any build) when NPM_TOKEN is missing, expired or lacks
        # access. Prints only the npm username and the scope's package list.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then echo "::error::NPM_TOKEN is not available to this job"; exit 1; fi
          NPM_USER=$(npm whoami --registry=https://registry.npmjs.org)
          echo "npm user: ${NPM_USER}"
          # Role in the decentralchain org: owner/admin/developer may create the never-published packages.
          npm org ls decentralchain "${NPM_USER}" --registry=https://registry.npmjs.org
          npm access list packages @decentralchain --registry=https://registry.npmjs.org

      - name: Check protobuf-schemas manifest versions
        run: node scripts/sync-proto-versions.mjs --check

      - name: Security audit
        run: pnpm audit --audit-level=moderate

      - name: Biome format
        run: pnpm exec biome format .

      - name: Biome lint
        run: pnpm nx run-many -t biome-lint --projects='packages/sdk/*'

      - name: Build
        run: pnpm nx run-many -t build --projects='packages/sdk/*'

      - name: Verify every SDK package imports in Node
        run: node scripts/check-dist-imports.mjs --require-all

      - name: Typecheck
        run: pnpm nx run-many -t typecheck --projects='packages/sdk/*'

      - name: Test
        run: pnpm nx run-many -t test --projects='packages/sdk/*'

      - name: Verify package exports
        run: pnpm nx run-many -t check:exports --projects='packages/sdk/*'

      - name: Verify package publishing
        run: pnpm nx run-many -t check:publint --projects='packages/sdk/*' --exclude=types

      - name: Verify bundle size
        run: pnpm nx run-many -t check:size --projects='packages/sdk/*'

      - name: Publish to npm
        # Publishes the on-disk version of every packages/sdk/* project; versions
        # already on the registry are skipped by the nx publish executor.
        run: pnpm nx release publish ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Verify published versions, install and import
        if: ${{ !inputs.dry-run }}
        run: node scripts/verify-npm-release.mjs --smoke

      - name: Generate SBOM
        if: ${{ !inputs.dry-run }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          artifact-name: sbom-${{ github.sha }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
