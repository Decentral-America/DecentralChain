name: Publish Protobuf Serialization

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.6.2)'
        required: true
        default: '1.6.2'
      run-audit-profile:
        description: 'Run the `-P audit` gate (OWASP dependency-check + SpotBugs + PMD) before deploy. Only disable for a release that adds zero new dependencies (verify with `git diff -- pom.xml`) — NVD sync can be throttled to the point of blowing the job timeout with no NVD_API_KEY secret configured; see _publish-maven.yml.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write        # reusable _publish-maven.yml requests these (SBOM + SLSA build-provenance);
  attestations: write    # a caller must grant >= the reusable job's permissions, else GitHub startup-fails

concurrency:
  group: publish-protobuf-schemas
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/_publish-maven.yml
    secrets: inherit
    with:
      package-path: packages/sdk/protobuf-schemas
      artifact-name: protobuf-schemas
      version: ${{ inputs.version }}
      run-audit-profile: ${{ inputs.run-audit-profile }}
