name: Cargo audit (weekly)

# groth16.yml and the protobuf-schemas crate only run on path changes, so a new RustSec
# advisory against an unchanged lockfile stayed invisible until the next unrelated edit
# (AUD-167). This runs the same audits every week.

on:
  schedule:
    - cron: '15 7 * * 1'  # Monday 07:15 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: groth16
            dir: packages/jvm/groth16
            ignores: --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2024-0388 --ignore RUSTSEC-2024-0436
          - name: protobuf-schemas crate
            dir: packages/sdk/protobuf-schemas
            ignores: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      - name: Resolve a lockfile when the crate has none
        working-directory: ${{ matrix.dir }}
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: cargo audit
        working-directory: ${{ matrix.dir }}
        run: cargo audit ${{ matrix.ignores }}
