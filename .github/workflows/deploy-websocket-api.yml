name: Deploy WebSocket API

on:
  # Tag-based release trigger: deploy fires only when you explicitly push a
  # versioned tag. Usage: git tag websocket-api/v1.0.0 && git push origin websocket-api/v1.0.0
  push:
    tags:
      - 'websocket-api/v*.*.*'

  # Manual dispatch: deploy to stagenet or testnet on demand.
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy (stagenet or testnet)'
        required: true
        default: 'testnet'
        type: choice
        options:
          - stagenet
          - testnet

concurrency:
  group: deploy-websocket-api-${{ github.event_name == 'workflow_dispatch' && inputs.network || 'mainnet' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/decentral-america/websocket-api

jobs:
  # ── Gate: deploy only commits that are on main and passed CI ─────────────────
  gate:
    name: Gate (commit on main)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # Rust services: bps.yml is path-filtered, so a green-run lookup can miss;
      # the docker job below runs `cargo nextest run --all-targets` before building.
      - name: Checkout (full history for the ancestry check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the deployed commit to be on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Deploy only commits merged to main."
            exit 1
          fi

  docker:
    name: Build and push Docker image
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.98'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Run tests
        working-directory: apps/websocket-api
        run: cargo nextest run --all-targets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/decentral-america/websocket-api
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=DCC WebSocket API
            org.opencontainers.image.description=Real-time WebSocket pub/sub gateway for DecentralChain
            org.opencontainers.image.vendor=Decentral-America

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/websocket-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  resolve:
    name: Resolve network
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: docker
    outputs:
      network: ${{ steps.network.outputs.network }}
    steps:
      - name: Determine target network
        id: network
        env:
          INPUT_NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "network=${INPUT_NETWORK}" >> "$GITHUB_OUTPUT"
          else
            echo "network=mainnet" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy via infra reusable workflow (Trivy gate, compose up --wait, auto-rollback) ──
  call-deploy:
    name: Deploy (${{ needs.resolve.outputs.network }})
    needs: [resolve]
    uses: Decentral-America/infra/.github/workflows/deploy-container.yml@4bc2daef19d93fc97b0fd69a93e55a1a00a9e56b # main
    with:
      network: ${{ needs.resolve.outputs.network }}
      image:   ghcr.io/decentral-america/websocket-api:${{ github.sha }}
      service: websocket-api
    secrets: inherit
