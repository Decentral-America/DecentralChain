name: Deploy Admin Dashboard

on:
  push:
    tags:
      - 'admin-dashboard/v*.*.*'

  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet

concurrency:
  group: ci-deploy-admin-dashboard-${{ github.event_name == 'workflow_dispatch' && inputs.network || 'testnet' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/decentral-america/admin-dashboard

jobs:
  resolve:
    name: Resolve parameters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-and-push
    outputs:
      network: ${{ steps.params.outputs.network }}

    steps:
      - name: Compute network
        id: params
        env:
          INPUT_NETWORK: ${{ inputs.network }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            NETWORK="${INPUT_NETWORK}"
          else
            NETWORK="testnet"
          fi

          case "$NETWORK" in
            mainnet|testnet) ;;
            *)
              echo "::error::Unknown network: $NETWORK"
              exit 1
              ;;
          esac

          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"

          echo "### Build parameters" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |"        >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|"        >> "$GITHUB_STEP_SUMMARY"
          echo "| Network   | \`$NETWORK\` |" >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=DCC Admin Dashboard
            org.opencontainers.image.description=Private admin dashboard for DecentralChain node operators
            org.opencontainers.image.vendor=Decentral-America

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/admin-dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  call-deploy:
    name: Deploy (${{ needs.resolve.outputs.network }})
    needs: [resolve]
    uses: Decentral-America/infra/.github/workflows/deploy-container.yml@1bf177abd396a804c9d2cbb8274c7bcb3ffdfd6d # main
    with:
      network: ${{ needs.resolve.outputs.network }}
      image:   ghcr.io/decentral-america/admin-dashboard:${{ github.sha }}
      service: admin-dashboard
    secrets: inherit
