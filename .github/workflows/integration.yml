name: Integration CI

on:
  push:
    # dev is a pure fast-forward mirror of main (never diverges) -- push here too fired this
    # workflow twice per merge for the identical commit sha, with no cancellation between them.
    branches: [main]
    paths:
      - 'packages/sdk/transactions/**'
      - 'packages/sdk/node-api/**'
      - 'docker-compose.test.yml'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'packages/sdk/transactions/**'
      - 'packages/sdk/node-api/**'
      - 'docker-compose.test.yml'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: integration-${{ github.ref }}

permissions:
  contents: read
  packages: read

env:
  # See ci.yml for the read-only-for-PRs rationale (Nx Cloud CI security guidance).
  NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'pull_request' && (secrets.NX_CLOUD_ACCESS_TOKEN_READONLY || secrets.NX_CLOUD_ACCESS_TOKEN) || secrets.NX_CLOUD_ACCESS_TOKEN }}
  # Set repo variable NX_NO_CLOUD=true to force-disable NX Cloud (e.g. during quota incidents).
  NX_NO_CLOUD: ${{ vars.NX_NO_CLOUD }}

jobs:
  integration:
    name: SDK Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # PostgreSQL for data-service (optional — skip if only testing node interaction)
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: dcc
          POSTGRES_USER: dcc
          POSTGRES_PASSWORD: dcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcc -d dcc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start DCC private node
        env:
          DCC_WALLET_SEED: ${{ secrets.DCC_TEST_WALLET_SEED }}
          DCC_WALLET_PASSWORD: ${{ secrets.DCC_TEST_WALLET_PASSWORD }}
        run: |
          set -euo pipefail
          # Pull the standard node-scala image and run with private chain configs
          # mounted in — no separate "private" image needed.
          if ! docker pull ghcr.io/decentral-america/node-scala:latest 2>/dev/null; then
            echo "::error::Cannot pull node-scala base image from GHCR. Make package public at https://github.com/orgs/Decentral-America/packages"
            exit 1
          fi
          # Resolve :latest to the digest we just pulled and run that digest, not
          # the mutable tag — the tag could be repointed between pull and run, and
          # pinning to what was actually pulled removes that window entirely.
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/decentral-america/node-scala:latest)
          echo "Running pinned digest: ${IMAGE_DIGEST}"
          docker run -d \
            --name dcc-test-node \
            --network host \
            -v "${{ github.workspace }}/docker/private-node/decentralchain.custom.conf:/etc/dcc/dcc.conf:ro" \
            -v "${{ github.workspace }}/docker/private-node/local.conf:/etc/dcc/local.conf:ro" \
            -e DCC_WALLET_SEED="${DCC_WALLET_SEED}" \
            -e DCC_WALLET_PASSWORD="${DCC_WALLET_PASSWORD}" \
            -e DCC_REST_API_BIND="0.0.0.0" \
            "${IMAGE_DIGEST}"

      - name: Wait for node to be ready
        run: |
          set -euo pipefail
          echo "Waiting for DCC node REST API..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:6869/node/version > /dev/null 2>&1; then
              echo "Node is ready (attempt $i)"
              curl -s http://localhost:6869/node/version | jq .
              break
            fi
            if [ $i -eq 60 ]; then
              echo "ERROR: Node failed to start in 60 seconds"
              docker logs dcc-test-node
              exit 1
            fi
            sleep 2
          done

      - name: Wait for block generation
        run: |
          set -euo pipefail
          echo "Waiting for at least 2 blocks..."
          for i in $(seq 1 30); do
            HEIGHT=$(curl -sf http://localhost:6869/blocks/height | jq .height)
            if [ "$HEIGHT" -ge 2 ] 2>/dev/null; then
              echo "Chain at height $HEIGHT — ready for tests"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: Chain stuck at height $HEIGHT after 60s"
              exit 1
            fi
            sleep 2
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .node-version

      # ── Rust / WASM toolchain (required by packages/sdk/crypto wasm-pack build) ──
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/sdk/crypto
          cache-on-failure: true

      - name: Install wasm-pack v0.15.0
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/wasm-pack.tar.gz
          echo "c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a  /tmp/wasm-pack.tar.gz" | sha256sum --check
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          mv /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      # ────────────────────────────────────────────────────────────────────────────

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK dependencies
        run: pnpm nx run-many -t build --projects=types,ts-lib-crypto,bignumber,marshall,protobuf-schemas,node-api,@decentralchain/transactions

      - name: Run integration tests
        env:
          DCC_TEST_NODE_URL: http://localhost:6869
          DCC_TEST_CHAIN_ID: R
          DCC_TEST_MINER_SEED: ${{ secrets.DCC_TEST_MINER_SEED }}
          DCC_TEST_MATCHER_URL: http://localhost:6886
        run: pnpm --filter @decentralchain/transactions test:integration

      - name: Node logs on failure
        if: failure()
        run: docker logs dcc-test-node 2>&1 | tail -100

      - name: Cleanup
        if: always()
        run: docker rm -f dcc-test-node 2>/dev/null || true
