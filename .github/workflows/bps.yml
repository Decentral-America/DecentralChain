name: BPS CI

on:
  push:
    # dev is a pure fast-forward mirror of main (never diverges) -- push here too fired this
    # workflow twice per merge for the identical commit sha, with no cancellation between them.
    branches: [main]
    paths:
      - 'apps/blockchain-postgres-sync/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/blockchain-postgres-sync/**'
  workflow_dispatch:

concurrency:
  group: bps-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler \
            libpq-dev

      - name: Install cargo-nextest, cargo-llvm-cov, cargo-deny, cargo-machete
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny@0.20.2,cargo-machete

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/blockchain-postgres-sync
          cache-on-failure: true

      - name: Check formatting
        working-directory: apps/blockchain-postgres-sync
        run: cargo fmt --all -- --check

      - name: Build
        working-directory: apps/blockchain-postgres-sync
        run: cargo build --all-targets

      - name: Clippy (deny warnings)
        working-directory: apps/blockchain-postgres-sync
        run: cargo clippy --all-targets -- -D warnings

      - name: Test with coverage (cargo-nextest + cargo-llvm-cov)
        id: test
        working-directory: apps/blockchain-postgres-sync
        run: |
          set -euo pipefail
          cargo llvm-cov nextest \
            --all-targets \
            --codecov \
            --output-path codecov.json

      - name: Upload coverage to Codecov
        if: steps.test.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/blockchain-postgres-sync/codecov.json
          flags: bps
          token: ${{ secrets.CODECOV_TOKEN }}
          skip_validation: true
          fail_ci_if_error: true

      - name: Check documentation
        working-directory: apps/blockchain-postgres-sync
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

      # ── Security & dependency policy ──────────────────────────────────────────
      - name: Dependency policy check (cargo deny)
        working-directory: apps/blockchain-postgres-sync
        run: cargo deny check

      - name: Unused dependency check (cargo machete)
        working-directory: apps/blockchain-postgres-sync
        run: cargo machete
