name: RIDE CI

on:
  push:
    # dev is a pure fast-forward mirror of main (never diverges) -- push here too fired this
    # workflow twice per merge for the identical commit sha, with no cancellation between them.
    branches: [main]
    paths:
      - 'packages/ride/**'
      - 'packages/jvm/groth16/**'
      - '.github/workflows/ride.yml'
  pull_request:
    paths:
      - 'packages/ride/**'
      - 'packages/jvm/groth16/**'
      - '.github/workflows/ride.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Scala 3 · JVM + Scala.js · Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # JDK 25 (Temurin) — sbt and JVM subprojects
      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: sbt

      # sbt runner script (setup-sbt installs runner 2.0.9) — the actual sbt version is resolved from packages/ride/project/build.properties
      - name: Install sbt launcher
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7  # v1.5.11

      # Node 24 — required by scalajs-env for Scala.js test execution
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      # pnpm — workspace package manager; version read from package.json#packageManager
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Install workspace dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      # ── Scala/sbt build ──────────────────────────────────────────────────

      # ── Rust JNI native library (required by lang-tests/groth16 JVM tests) ──
      # The groth16 JAR bundles libgroth16_jni.so at META-INF/native/linux64/amd64/.
      # The placeholder .gitkeep is empty; the .so must be compiled and staged
      # before ./mvnw install or the JAR won't contain it and sbt test will fail
      # with UnsatisfiedLinkError.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: packages/jvm/groth16

      - name: Build groth16_jni native library (linux/amd64)
        working-directory: packages/jvm/groth16/groth16_jni
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Stage native library into groth16 resources
        run: |
          set -euo pipefail
          rm -f packages/jvm/groth16/groth16_jni/javalib/src/main/resources/META-INF/native/linux64/amd64/.gitkeep
          cp packages/jvm/groth16/target/x86_64-unknown-linux-gnu/release/libgroth16_jni.so \
             packages/jvm/groth16/groth16_jni/javalib/src/main/resources/META-INF/native/linux64/amd64/
      # ─────────────────────────────────────────────────────────────────────────

      # Install local Maven artifacts not yet published to Maven Central
      - name: Install curve25519 to local Maven cache
        working-directory: packages/jvm/curve25519
        run: ./mvnw install -DskipTests --no-transfer-progress

      - name: Install groth16 to local Maven cache
        working-directory: packages/jvm/groth16
        run: ./mvnw install -DskipTests --no-transfer-progress

      - name: Install protobuf-schemas to local Maven cache
        working-directory: packages/sdk/protobuf-schemas
        run: ./mvnw install -DskipTests --no-transfer-progress

      - name: Prune non-decentralchain artifacts from local Maven cache
        # Keep only io.decentralchain artifacts installed above.
        # sbt/Coursier then fetches all other deps from Maven Central via HTTP.
        # Without this, Coursier may follow file:// paths from a restored cache
        # pointing to ~/.m2 JARs that weren't installed in this run.
        run: |
          set -euo pipefail
          find ~/.m2/repository -mindepth 1 -maxdepth 1 -type d ! -name "io" -exec rm -rf {} +
          if [ -d ~/.m2/repository/io ]; then
            find ~/.m2/repository/io -mindepth 1 -maxdepth 1 -type d ! -name "decentralchain" -exec rm -rf {} +
          fi

      - name: Compile all subprojects (JVM + Scala.js cross-build)
        working-directory: packages/ride
        run: sbt --no-colors compile

      - name: Run JVM test suite
        working-directory: packages/ride
        run: sbt --no-colors test

      # Produces packages/ride/lang/js/dist/lang.js + packages/ride/repl/js/dist/repl.js.
      # fullOptJS, not fullLinkJS: only fullOptJS honours the artifactPath in lang/js and
      # repl/js build.sbt, and it is the exact step publish-ride.yml runs for a release.
      # fullLinkJS wrote to target/*-opt, so the upload below silently found nothing.
      - name: Build Scala.js full-link bundles
        working-directory: packages/ride
        run: sbt --no-colors 'project langJS; fullOptJS; project replJS; fullOptJS'

      # ── TypeScript wrapper (@decentralchain/ride) ─────────────────────

      - name: Build TypeScript wrapper
        run: pnpm -F @decentralchain/ride build

      - name: Upload Scala.js bundles (lang + repl)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ride-bundles
          path: |
            packages/ride/lang/js/dist/
            packages/ride/repl/js/dist/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Quality Gate (sbt bulletproof)
    runs-on: ubuntu-latest
    needs: build
    # Also run on pull_request: this job asserts real correctness (scalafmt,
    # scalafixAll, unused/undeclared deps, tests) — gating it to main/dev only
    # meant violations were invisible during review and only surfaced after
    # merge (see the scalafixAll import-order fix that had to follow up).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: sbt

      - name: Install sbt launcher
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7  # v1.5.11

      # ── Rust JNI native library (required by bulletproof → test → lang-tests) ─
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: packages/jvm/groth16

      - name: Build groth16_jni native library (linux/amd64)
        working-directory: packages/jvm/groth16/groth16_jni
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Stage native library into groth16 resources
        run: |
          set -euo pipefail
          rm -f packages/jvm/groth16/groth16_jni/javalib/src/main/resources/META-INF/native/linux64/amd64/.gitkeep
          cp packages/jvm/groth16/target/x86_64-unknown-linux-gnu/release/libgroth16_jni.so \
             packages/jvm/groth16/groth16_jni/javalib/src/main/resources/META-INF/native/linux64/amd64/
      # ─────────────────────────────────────────────────────────────────────────

      - name: Install curve25519 to local Maven cache
        working-directory: packages/jvm/curve25519
        run: ./mvnw install -DskipTests --no-transfer-progress

      - name: Install groth16 to local Maven cache
        working-directory: packages/jvm/groth16
        run: ./mvnw install -DskipTests --no-transfer-progress

      - name: Install protobuf-schemas to local Maven cache
        working-directory: packages/sdk/protobuf-schemas
        run: ./mvnw install -DskipTests --no-transfer-progress

      - name: Prune non-decentralchain artifacts from local Maven cache
        run: |
          set -euo pipefail
          find ~/.m2/repository -mindepth 1 -maxdepth 1 -type d ! -name "io" -exec rm -rf {} +
          if [ -d ~/.m2/repository/io ]; then
            find ~/.m2/repository/io -mindepth 1 -maxdepth 1 -type d ! -name "decentralchain" -exec rm -rf {} +
          fi

      - name: Run bulletproof quality gate
        working-directory: packages/ride
        run: sbt --no-colors bulletproof
        # bulletproof = scalafmtCheckAll → scalafixAll --check →
        #   undeclaredCompileDependencies → unusedCompileDependencies →
        #   coverage → test → coverageReport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ride-coverage-report
          path: packages/ride/target/scala-*/scoverage-report/
          retention-days: 14

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: sbt

      - name: Install sbt launcher
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7  # v1.5.11

      - name: Generate dependency list (lang-jvm + lang-testkit)
        working-directory: packages/ride
        run: |
          set -euo pipefail
          sbt --no-colors "lang-jvm/dependencyList; lang-testkit/dependencyList" \
            > lang-deps.txt 2>&1 || true
          cat lang-deps.txt

      - name: Upload dependency manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ride-dependency-manifest
          path: packages/ride/lang-deps.txt
          retention-days: 90
