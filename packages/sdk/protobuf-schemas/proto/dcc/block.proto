syntax = "proto3";
package dcc;
option java_package = "io.decentralchain.protobuf.block";
option csharp_namespace = "DecentralChain";
option go_package = "github.com/Decentral-America/protobuf-schemas/pkg/grpc/generated/dcc";

import "dcc/transaction.proto";

message Block {
    message Header {
        message ChallengedHeader {
            int64 base_target = 1;
            bytes generation_signature = 2;
            repeated uint32 feature_votes = 3;
            int64 timestamp = 4;
            bytes generator = 5;
            int64 reward_vote = 6;
            bytes state_hash = 7;
            bytes header_signature = 8;
            FinalizationVoting finalization_voting = 9;
        }

        int32 chain_id = 1;
        bytes reference = 2;
        int64 base_target = 3;
        bytes generation_signature = 4;
        repeated uint32 feature_votes = 5;
        int64 timestamp = 6;
        int32 version = 7;
        bytes generator = 8;
        int64 reward_vote = 9;
        bytes transactions_root = 10;
        bytes state_hash = 11;
        ChallengedHeader challenged_header = 12;
        FinalizationVoting finalization_voting = 13;
        // Blake2b-256 of sorted (address ++ blsPublicKey) pairs committed for the next generation period.
        // Non-empty only at period boundary blocks (height % generationPeriodLength == 0).
        bytes committed_generators_hash = 14;
    }

    Header header = 1;
    bytes signature = 2;
    repeated SignedTransaction transactions = 3;
}

message MicroBlock {
    int32 version = 1;
    bytes reference = 2;
    bytes updated_block_signature = 3;
    bytes sender_public_key = 4;
    repeated SignedTransaction transactions = 5;
    bytes state_hash = 6;
    FinalizationVoting finalization_voting = 7;
}

message SignedMicroBlock {
    MicroBlock micro_block = 1;
    bytes signature = 2;
    bytes total_block_id = 3;
}

message EndorseBlock {
    int32 endorser_index = 1;
    bytes finalized_block_id = 2;
    uint32 finalized_block_height = 3;
    bytes endorsed_block_id = 4;
    bytes signature = 5; // BLS
}

message FinalizationVoting {
    repeated int32 endorser_indexes = 1;
    int32 finalized_block_height = 2;
    bytes aggregated_endorsement_signature = 3; // BLS
    repeated EndorseBlock conflict_endorsements = 4;
    // T5 (see docs/hotstuff-audit-readiness.md in node-scala): proof that a committed generator
    // double-signed within the T2 HotStuff protocol (two votes, same voter/view/phase, different
    // block_id). Kept as its own field rather than reusing EndorseBlock/conflict_endorsements
    // because a HotStuffVote's signature is over a different canonical message
    // (view, phase, block_id, block_height, committee_epoch) than an EndorseBlock's
    // (finalized_block_id, finalized_block_height, endorsed_block_id) -- forcing one shape into the
    // other's verification path would silently break signature checking either way. Added with
    // proto3 default-empty semantics: an old peer simply never sets this field and decodes it as
    // empty, matching "no equivocation evidence" -- fully backward compatible, same pattern as
    // HotStuffVote.committee_epoch (schema 1.6.5). Gated off entirely by
    // dcc.hotstuff.slashing-enabled (default false) on the node-scala side until externally audited.
    repeated HotStuffEquivocationProof hotstuff_conflicts = 5;
}

// --- T2 HotStuff BFT fast-finality (see CONSENSUS.md) ---
// Wire messages for the pipelined 3-phase HotStuff engine over the committed-generator committee.
// GATED behind dcc.hotstuff.enabled (default off); testnet-first. The exact field semantics
// (what is signed, phase transitions) are subject to consensus-design review, and the wire format
// may evolve until mainnet enablement (which is gated on external audit + testnet soak).
enum HotStuffPhase {
    HOTSTUFF_PHASE_UNSPECIFIED = 0;
    HOTSTUFF_PHASE_PREPARE = 1;
    HOTSTUFF_PHASE_PRE_COMMIT = 2;
    HOTSTUFF_PHASE_COMMIT = 3;
}

// A single committed generator's vote for a block in a given view and phase.
// Signature is a BLS signature over the canonical encoding of
// (view, phase, block_id, block_height, committee_epoch).
message HotStuffVote {
    uint32 view = 1;              // monotonic round/view number
    HotStuffPhase phase = 2;
    bytes block_id = 3;           // block being voted on
    uint32 block_height = 4;
    int32 voter_index = 5;        // index in the committed generator set for the period
    bytes signature = 6;          // BLS
    // Generation-period index (see GenerationPeriod.from in node-scala) of the committee this vote
    // was cast under. Added in schema 1.6.5 to close the cross-committee-epoch fork hazard (T10):
    // it is folded into the signed bytes so a vote/QC can never be verified against a committee for
    // a DIFFERENT epoch than the one it was actually signed under, even at an identical
    // (view, block_height). Field added with proto3 default-0 semantics for backward compatibility —
    // see that commit's message for the full compat analysis. 0 is not a valid real epoch pre-
    // DeterministicFinality activation, so old senders (who never set this field) and new receivers
    // agree on treating an absent/zero value as "pre-activation, no epoch binding applies".
    uint32 committee_epoch = 7;
}

// Aggregated proof that >= 2/3 of committed stake voted for (view, phase, block_id) under a single
// committee epoch.
// aggregated_signature is the BLS aggregate of the individual HotStuffVote signatures from signer_indexes.
message QuorumCertificate {
    uint32 view = 1;
    HotStuffPhase phase = 2;
    bytes block_id = 3;
    uint32 block_height = 4;
    repeated int32 signer_indexes = 5;   // committed generators whose votes are aggregated
    bytes aggregated_signature = 6;      // BLS aggregate
    // See HotStuffVote.committee_epoch above — identical semantics/compat story.
    uint32 committee_epoch = 7;
}

// Verifiable proof that voter_index double-signed within one (view, phase): vote_a and vote_b are
// the two conflicting HotStuffVotes (same voter_index/view/phase, different block_id), each
// independently checkable against that voter's BLS key via the normal HotStuffVote signature
// verification. See FinalizationVoting.hotstuff_conflicts above.
message HotStuffEquivocationProof {
    int32 voter_index = 1;
    uint32 view = 2;
    HotStuffPhase phase = 3;
    HotStuffVote vote_a = 4;
    HotStuffVote vote_b = 5;
}

// A leader's HotStuff proposal: extend `block_id` at `view`, justified by `justify` (the highQC the
// leader is extending). The `justify` linkage is what lets replicas verify the prepare→pre-commit→
// commit chain (the 3-chain commit rule) — without it the safety rule has no justification to check.
message HotStuffProposal {
    uint32 view = 1;
    bytes block_id = 2;
    QuorumCertificate justify = 3;
}
