[package]
authors = ["DecentralChain <dev@decentralchain.io>"]
description = "Cryptographic functions for DecentralChain blockchain"
edition = "2021"
license = "MIT"
name = "decentralchain-crypto"
repository = "https://github.com/Decentral-America/crypto"
version = "1.0.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = 's'

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '-c']

[dependencies]
argon2 = {version = "0.6.0", default-features = false, features = ["alloc"]}
ed25519-axolotl = "1.7"
ed25519-compact = {version = "2.6", features = ["opt_size", "traits", "x25519"]}
getrandom = {version = "0.4", features = ["wasm_js"]}
# Also enable js feature for getrandom 0.2 transitive dependencies. Intentionally 0.2:
# ed25519-axolotl 1.7.1 (latest) -> rand 0.8 -> rand_core 0.6 -> getrandom 0.2, which
# needs its own `js` feature on wasm32-unknown-unknown.
getrandom02 = {version = "0.2", features = ["js"], package = "getrandom"}
wasm-bindgen = "0.2"
