packages:
  - 'packages/sdk/*'
  - 'packages/ride/lang/js'
  - 'packages/ride/repl/js'
  - 'packages/ride/ts'
  - 'packages/jvm/*'
  - 'packages/e2e-blockchain'
  - 'apps/*'
  - 'e2e'

catalog:
  '@arethetypeswrong/cli': 0.18.5
  '@babel/core': 8.0.6
  '@coral-xyz/anchor': 0.32.1
  '@fontsource-variable/inter': 5.3.0
  '@number-flow/react': 0.6.2
  '@rolldown/plugin-babel': 0.2.4
  '@size-limit/preset-small-lib': 14.1.0
  '@solana/wallet-adapter-base': 0.9.28
  '@solana/wallet-adapter-phantom': 0.9.30
  '@solana/wallet-adapter-react': 0.15.40
  '@solana/wallet-adapter-solflare': 0.6.34
  '@solana/web3.js': 1.99.0
  '@types/babel__core': 7.20.5
  '@types/node': 26.6.3
  '@vitest/coverage-v8': 4.1.11
  babel-plugin-react-compiler: ^1.0.0
  bs58: ^6.0.0
  buffer: ^6.0.3
  fancy-canvas: 2.1.0
  ioredis: 6.0.0
  js-yaml: 5.4.2
  jsdom: 30.1.1
  publint: 0.3.24
  size-limit: 14.1.0
  tsdown: 0.23.0
  vitest: 4.1.11

# pnpm v11: non-auth .npmrc settings are ignored; declare them here instead.
engineStrict: true
saveExact: true

# Fail installs if a dependency uses "catalog:" but isn't declared above,
# instead of silently falling back to whatever version pnpm would otherwise pick.
catalogMode: strict

allowBuilds:
  '@bufbuild/buf': false
  '@connectrpc/connect': false
  '@connectrpc/connect-node': false
  '@evilmartians/lefthook': false
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  # Optional native accelerators pulled in by the Solana libraries. Each has a
  # pure-JS fallback, and none of them reach the browser bundle — building them
  # would put a C++ toolchain on the critical path of every CI run for no gain.
  bigint-buffer: false
  bufferutil: false
  core-js-pure: true
  edgedriver: true
  esbuild: false
  geckodriver: true
  lefthook: false
  libpq: true
  nx: false
  sharp: true
  utf-8-validate: false
  workerd: false

overrides:
  # jsdom@29 requires undici@^7 internal paths (wrap-handler.js, etc.) which were
  # removed in undici v8. Stay on ^7.x until jsdom@30+ ships with undici v8 support.
  # admin-dashboard removed its direct undici dep (Node 24 native fetch covers all usage).
  # >=7.29.0: 5 GHSA advisories (CRLF injection via blob body type, cross-user
  # cache-control disclosure, cookie attribute injection, response desync via
  # retry interceptor, cache-directive parse crash) all fixed in 7.29.0.
  undici: ">=7.29.0 <8.0.0"
  esbuild: '>=0.28.1'
  '@xmldom/xmldom': '>=0.9.10'
  # GHSA-2v37-7h3g-55p8: custom generators can loop indefinitely when size is zero.
  nanoid: '>=3.3.18'
  # GHSA-xhg8-fm23-9pgj: unvalidated symlink path traversal on archive extraction.
  extract-zip: '>=2.0.1'
  # axios <1.18.0: NO_PROXY 0.0.0.0 bypass, prototype-pollution auth/request-construction
  # gadgets, Node adapter proxy-after-interceptor-clone (GHSA advisories, several HIGH/MEDIUM).
  axios: '>=1.18.0'
  # sharp <0.35.0 inherits several libvips CVEs (CVE-2026-33327/33328/35590/35591).
  sharp: '>=0.35.0'
  # tmp@0.2.6 is vulnerable (GHSA-7c78-jf6q-g5cm); 0.2.7 patches it
  tmp: '>=0.2.7'
  # form-data@<4.0.6 has CRLF injection (GHSA-hmw2-7cc7-3qxx)
  form-data: '>=4.0.6'
  # morgan <1.12.1: log forging via unneutralized control chars (GHSA-4vj7-5mj6-jm8m),
  # unescaped Unicode line separators (<1.12.0) and unescaped double quotes (<1.12.1).
  morgan: '>=1.12.1'
  # @babel/core<=7.29.0 arbitrary file read via sourceMappingURL (GHSA-4x5r-pxfx-6jf8)
  '@babel/core': '>=7.29.6'
  basic-ftp: '>=5.3.1'
  # brace-expansion <5.0.8: two DoS advisories -- CVE-2026-14257 (exponential-time
  # expansion of consecutive non-expanding {} groups, fixed 5.0.7) and
  # CVE-2026-69152 (unbounded intermediate arrays bypassing that same fix,
  # fixed 5.0.8). The 5.0.7 floor below was only the first of the two.
  brace-expansion: '>=5.0.8'
  defu: '>=6.1.5'
  # fast-xml-parser <5.10.1: repeated DOCTYPE declarations reset entity expansion limits.
  fast-xml-parser: '>=5.10.1'
  follow-redirects: '>=1.16.0'
  # ip-address <10.3.1: inconsistent IP address parsing enables SSRF (CVE-2026-69192).
  # The 10.1.1 floor below predates this fix.
  ip-address: '>=10.3.1'
  lodash: '>=4.18.1'
  # Scoped to express: blanket >=0.1.13 resolved to 8.x (different API), breaking express v4.
  # CVE fix: keep 0.1.x for express (where ReDoS is low-risk — routes are dev-defined),
  # allow react-router to use 8.x naturally.
  express>path-to-regexp: '~0.1.13'
  picomatch: '>=4.0.4'
  # postcss <=8.5.17: path traversal in previous sourceMappingURL auto-loading leaks
  # arbitrary .map file contents (GHSA advisory); 8.5.18 patches it.
  postcss: '>=8.5.18'
  # qs <6.16.0: array-limit bypass via bracket-key comma parsing, and DoS via
  # attacker-controlled isBuffer. The 6.15.2 floor predates both fixes.
  qs: '>=6.16.0'
  # jayson 4.x (via @solana/web3.js ^4.3.0) pins uuid@8 (buffer bounds check, fixed
  # 11.1.1) and stream-json@1 (O(depth^2) filters, fixed 3.5.0). jayson 5 drops both
  # deps; web3.js only uses jayson/lib/client/browser, which 5.x keeps unchanged.
  '@solana/web3.js>jayson': '^5.0.0'
  # @coral-xyz/anchor 0.32.1 (latest) pins toml@^3 (prototype pollution + uncontrolled
  # recursion, fixed 4.2.0). toml 5 keeps the same single parse() export anchor calls.
  '@coral-xyz/anchor>toml': '^5.0.0'
  # @solflare-wallet/sdk 1.4.2 (latest, unmaintained since 2024-01) pins uuid@^9 (missing
  # buffer bounds check in v3/v5/v6, fixed 11.1.1). It only calls v4(); ^14 matches the
  # uuid rpc-websockets already resolves, and Node >=24 require()s its ESM build.
  '@solflare-wallet/sdk>uuid': '^14.0.2'
  # valibot <=1.4.1: record() issue paths can make flatten() throw for inherited
  # Object property names (GHSA advisory); 1.4.2 patches it.
  valibot: '>=1.4.2'
  ws: '>=8.20.1'
  yaml: '>=2.8.3'
  yauzl: '^3.2.1'

# Suppress the cyclic workspace dependency warning.
# node-api ↔ transactions: transactions lists node-api as a peerDependency;
# node-api lists transactions in devDependencies for test fixtures only.
# This is intentional – the cycle is test-only and causes no runtime issues.
ignoreWorkspaceCycles: true
